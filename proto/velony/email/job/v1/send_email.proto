
syntax = "proto3";

package velony.email.job.v1;

option go_package = "github.com/velonyapp/email/gen/job/v1;jobv1";

message SendEmailPayload {
  string          from = 1;
  repeated string to   = 2;
  repeated string cc   = 3;
  repeated string bcc  = 4;

  string              template  = 5;
  map<string, string> variables = 6;

  string idempotency_key = 7;
}
